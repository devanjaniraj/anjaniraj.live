            top: 0;
            z-index: 100;

            text-decoration: none;

            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.3s ease;

        .nav-logo::after {

        }

        .nav-links {

            align-items: center;

            width: 24px;
            height: 2px;
            background: var(--text);
            margin: 5px 0;
            transition: 0.3s;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        // Render blog posts
        function renderPosts(posts = blogPosts) {
            const blogPostsContainer = document.getElementById('blogPosts');
            blogPostsContainer.innerHTML = '';

            posts.forEach(post => {
                const postElement = document.createElement('a');
                postElement.href = post.url;
                postElement.className = 'blog-card fade-in';
                postElement.dataset.category = post.category;
                postElement.innerHTML = `
                    <div class="blog-meta">
                        <div class="meta-item">
                            <i class="fas fa-calendar"></i>
                            <time>${post.date}</time>
                        </div>
                        <div class="meta-item">
                            <i class="fas fa-clock"></i>
                            ${post.readTime} read
                        </div>
                        <span class="blog-category">${post.category}</span>
                    </div>
                    <h2>${post.title}</h2>
                    <p class="blog-excerpt">${post.excerpt}</p>
                    <div class="blog-footer">
                        <span class="read-more">
                            Read Article
                            <i class="fas fa-arrow-right"></i>
                        </span>
                    </div>
                `;
                blogPostsContainer.appendChild(postElement);
            });
        }

        const filterButtons = document.querySelectorAll('.filter-btn');

                button.classList.add('active');

                if (filter === 'all') {
                    renderPosts(blogPosts);
                } else {
                    const filtered = blogPosts.filter(post => post.category === filter);
                    renderPosts(filtered);
                }
            });
        });

        // Search functionality
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = blogPosts.filter(post => 
                post.title.toLowerCase().includes(query) || 
                post.excerpt.toLowerCase().includes(query)
            );
            renderPosts(filtered);
        });

        // Initial render
        renderPosts();

        // Track page view
        if (window.gtag) {
            gtag('event', 'page_view', { page_path: '/blog.html' });
        }
    </script>
</body>
</html>
